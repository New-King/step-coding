<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C · 左右分栏</title>
    <style>
      :root {
        --page: #f4f4f6;
        --card: #fff;
        --ink: #101012;
        --muted: #7a7a80;
        --faint: #b4b4ba;
        --line: rgba(0, 0, 0, 0.07);
        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: var(--page); color: var(--ink);
        font: 14px/1.6 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .shell {
        min-height: 100vh; max-width: 1160px; margin: 0 auto;
        padding: 34px 40px 44px; display: flex; flex-direction: column;
      }

      header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 46px; }
      .brand { display: flex; align-items: center; gap: 10px; font-size: 13px; letter-spacing: 0.4px; }
      .brand .mark {
        width: 26px; height: 26px; border-radius: 7px; background: var(--ink); position: relative;
      }
      .brand .mark::after {
        content: ""; position: absolute; inset: 7px; border-radius: 2px; background: rgba(255, 255, 255, 0.9);
      }
      .nav { display: flex; gap: 26px; font-size: 12.5px; color: var(--muted); }
      .nav a { color: inherit; text-decoration: none; transition: color 0.16s var(--ease); }
      .nav a:hover { color: var(--ink); }

      .layout {
        flex: 1; display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 56px; align-items: center;
      }

      h1 {
        margin: 0 0 18px; font-size: 56px; line-height: 1.06; letter-spacing: -2px; font-weight: 600;
      }
      h1 span { color: var(--faint); }
      .lede { margin: 0 0 32px; max-width: 420px; font-size: 15px; line-height: 1.8; color: var(--muted); }

      /* 示例：竖着排，像清单 */
      .picks { display: flex; flex-direction: column; gap: 2px; max-width: 420px; }
      .picks button {
        display: flex; align-items: center; gap: 12px;
        padding: 11px 12px; border: 0; border-radius: 10px; background: none;
        font: inherit; font-size: 14px; color: var(--muted); text-align: left; cursor: pointer;
        transition: background 0.16s var(--ease), color 0.16s var(--ease), transform 0.16s var(--ease);
      }
      .picks button::before {
        content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--faint);
        flex: none; transition: background 0.16s var(--ease), transform 0.16s var(--ease);
      }
      .picks button:hover { background: rgba(0, 0, 0, 0.035); color: var(--ink); transform: translateX(2px); }
      .picks button:hover::before { background: var(--ink); transform: scale(1.4); }

      /* 右边：一张卡，输入 + 最近 */
      .panel {
        background: var(--card); border-radius: 20px; padding: 22px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.07), 0 1px 2px rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(0, 0, 0, 0.03);
      }
      .composer { display: flex; align-items: flex-end; gap: 10px; padding: 6px 6px 6px 14px; border-radius: 14px; border: 1px solid var(--line); }
      .composer:focus-within { border-color: rgba(0, 0, 0, 0.18); }
      .composer textarea {
        flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: transparent;
        font: inherit; font-size: 14.5px; line-height: 1.6; padding: 10px 0; max-height: 120px;
      }
      .composer .send {
        width: 34px; height: 34px; flex: 0 0 34px; border: 0; border-radius: 10px;
        background: var(--ink); color: #fff; font-size: 15px; cursor: pointer;
        display: grid; place-items: center; transition: transform 0.14s var(--ease), background 0.14s var(--ease);
      }
      .composer .send:hover { background: #333; }
      .composer .send:active { transform: scale(0.94); }

      .recent-head {
        display: flex; align-items: center; justify-content: space-between;
        margin: 20px 2px 8px; font-size: 10.5px; letter-spacing: 1.1px;
        text-transform: uppercase; color: var(--faint);
      }
      .recent-head button {
        border: 0; background: none; font: inherit; font-size: 11px; letter-spacing: 0;
        text-transform: none; color: var(--muted); cursor: pointer;
      }
      .recent-head button:hover { color: var(--ink); }

      .card-row {
        display: flex; align-items: center; gap: 12px; padding: 12px 10px;
        border-radius: 12px; cursor: pointer; transition: background 0.16s var(--ease);
      }
      .card-row:hover { background: #f6f6f8; }
      .card-row .main { flex: 1; min-width: 0; }
      .card-row .state { display: block; font-size: 10.5px; letter-spacing: 0.6px; text-transform: uppercase; color: var(--faint); }
      .card-row .state.done { color: #6f9c72; }
      .card-row .text { display: block; margin-top: 3px; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .card-row .acts { display: flex; gap: 2px; opacity: 0; transform: translateX(4px); transition: 0.18s var(--ease); }
      .card-row:hover .acts, .card-row:focus-within .acts { opacity: 1; transform: none; }
      .card-row .acts button {
        width: 26px; height: 26px; border: 0; border-radius: 8px; background: none;
        color: var(--muted); cursor: pointer; display: grid; place-items: center;
        transition: background 0.15s, color 0.15s, transform 0.12s var(--ease);
      }
      .card-row .acts button:hover { background: rgba(0, 0, 0, 0.06); color: var(--ink); }
      .card-row .acts button.danger:hover { background: rgba(179, 38, 30, 0.08); color: #b3261e; }
      .card-row .acts button:active { transform: scale(0.9); }
      .card-row .acts svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

      footer { padding-top: 30px; font-size: 11px; letter-spacing: 0.6px; color: var(--faint); }

      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; gap: 32px; }
        h1 { font-size: 40px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand"><span class="mark"></span>Step Coding</div>
        <nav class="nav">
          <a href="#">例子</a>
          <a href="#">最近的</a>
          <a href="#">GitHub</a>
        </nav>
      </header>

      <div class="layout">
        <div>
          <h1>Take<br />your time<span>.</span></h1>
          <p class="lede">先想、再看、再问、再动手——每一步都留在屏幕上。慢一点没关系，看懂了才算数。</p>
          <div class="picks">
            <button>登录注册是怎么回事</button>
            <button>function call 怎么调起来的</button>
            <button>LangGraph 的节点怎么串</button>
            <button>快速排序为什么快</button>
            <button>爬虫怎么抓到数据</button>
          </div>
        </div>

        <div class="panel">
          <div class="composer">
            <textarea rows="1"></textarea>
            <button class="send" aria-label="发送">→</button>
          </div>
          <div class="recent-head">
            <span>最近</span>
            <button>清空</button>
          </div>
          <div class="card-row">
            <div class="main"><span class="state done">已完成</span><span class="text">登录注册是怎么回事</span></div>
            <div class="acts">
              <button aria-label="继续修改"><svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg></button>
              <button class="danger" aria-label="删除"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg></button>
            </div>
          </div>
          <div class="card-row">
            <div class="main"><span class="state done">已完成</span><span class="text">function call 怎么调起来的</span></div>
            <div class="acts">
              <button aria-label="继续修改"><svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg></button>
              <button class="danger" aria-label="删除"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg></button>
            </div>
          </div>
          <div class="card-row">
            <div class="main"><span class="state">未完成</span><span class="text">爬虫怎么抓到数据</span></div>
            <div class="acts">
              <button aria-label="继续修改"><svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg></button>
              <button class="danger" aria-label="删除"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg></button>
            </div>
          </div>
        </div>
      </div>

      <footer>STEP CODING · 看清每一步</footer>
    </div>
  </body>
</html>
