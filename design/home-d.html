<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D · 深色终端</title>
    <style>
      :root {
        --bg: #0b0b0d;
        --panel: #131316;
        --ink: #ececef;
        --muted: #8a8a93;
        --faint: #55555d;
        --line: rgba(255, 255, 255, 0.09);
        --accent: #c9f56a;
        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: var(--bg); color: var(--ink);
        font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, "PingFang SC", monospace;
        -webkit-font-smoothing: antialiased;
      }
      .page { max-width: 860px; margin: 0 auto; padding: 60px 28px 90px; }

      .bar {
        display: flex; align-items: center; justify-content: space-between;
        padding-bottom: 14px; border-bottom: 1px solid var(--line);
        font-size: 11.5px; color: var(--faint);
      }
      .bar .l { display: flex; align-items: center; gap: 8px; color: var(--muted); }
      .bar .l i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
      .bar .r { display: flex; gap: 16px; }
      .bar .r a { color: var(--faint); text-decoration: none; }
      .bar .r a:hover { color: var(--ink); }

      h1 {
        margin: 66px 0 16px; font-size: 44px; line-height: 1.15; font-weight: 500;
        letter-spacing: -1.2px; color: var(--ink);
      }
      h1 .cursor { display: inline-block; width: 12px; height: 34px; background: var(--accent); vertical-align: -3px; margin-left: 6px; animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      .sub { margin: 0 0 40px; font-size: 13.5px; line-height: 1.8; color: var(--muted); }
      .sub b { color: var(--ink); font-weight: 500; }

      /* 输入：一行 prompt */
      .ask {
        display: flex; align-items: center; gap: 10px;
        padding: 16px 18px; border: 1px solid var(--line); border-radius: 10px;
        background: var(--panel); transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
      }
      .ask:focus-within { border-color: rgba(201, 245, 106, 0.4); box-shadow: 0 0 0 3px rgba(201, 245, 106, 0.08); }
      .ask .prompt { color: var(--accent); font-size: 14px; }
      .ask textarea {
        flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: transparent;
        color: var(--ink); font: inherit; font-size: 14px; line-height: 1.6; padding: 3px 0; max-height: 120px;
      }
      .ask .go {
        border: 1px solid var(--line); background: transparent; color: var(--muted);
        font: inherit; font-size: 11.5px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
        transition: color 0.16s var(--ease), border-color 0.16s var(--ease), background 0.16s var(--ease);
      }
      .ask .go:hover { color: var(--bg); background: var(--accent); border-color: var(--accent); }

      /* 示例：终端里那种选项 */
      .examples { margin: 26px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
      .examples button {
        border: 1px solid var(--line); background: transparent; color: var(--muted);
        font: inherit; font-size: 12px; padding: 7px 12px; border-radius: 6px; cursor: pointer;
        transition: color 0.16s var(--ease), border-color 0.16s var(--ease), transform 0.16s var(--ease);
      }
      .examples button:hover { color: var(--ink); border-color: rgba(255, 255, 255, 0.24); transform: translateY(-1px); }

      /* 最近：日志行 */
      .recent { margin-top: 54px; }
      .recent-head {
        display: flex; justify-content: space-between; align-items: baseline;
        font-size: 11px; color: var(--faint); padding-bottom: 10px; border-bottom: 1px solid var(--line);
      }
      .recent-head button { border: 0; background: none; color: var(--faint); font: inherit; font-size: 11px; cursor: pointer; }
      .recent-head button:hover { color: var(--ink); }

      .line {
        display: flex; align-items: center; gap: 12px; padding: 13px 2px;
        border-bottom: 1px solid var(--line); cursor: pointer;
        transition: background 0.16s var(--ease);
      }
      .line:hover { background: rgba(255, 255, 255, 0.02); }
      .line .ok { color: var(--accent); font-size: 11px; width: 20px; }
      .line .ok.wait { color: var(--faint); }
      .line .t { flex: 1; min-width: 0; font-size: 13px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .line .meta { font-size: 11px; color: var(--faint); }
      .line .acts { display: flex; gap: 10px; opacity: 0; transition: opacity 0.16s var(--ease); }
      .line:hover .acts, .line:focus-within .acts { opacity: 1; }
      .line .acts button { border: 0; background: none; color: var(--faint); font: inherit; font-size: 11px; cursor: pointer; }
      .line .acts button:hover { color: var(--ink); }
      .line .acts button.danger:hover { color: #ff7b72; }

      footer { margin-top: 52px; font-size: 11px; color: var(--faint); }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="bar">
        <span class="l"><i></i>step-coding · ready</span>
        <span class="r"><a href="#">examples</a><a href="#">recent</a><a href="#">github</a></span>
      </div>

      <h1>Take your time<span class="cursor"></span></h1>
      <p class="sub">
        <b>先想 → 再看 → 再问 → 再动手。</b><br />
        代码一行一行写在屏幕上，慢一点也看得清。
      </p>

      <div class="ask">
        <span class="prompt">›</span>
        <textarea rows="1"></textarea>
        <button class="go">run</button>
      </div>

      <div class="examples">
        <button>登录注册是怎么回事</button>
        <button>function call 怎么调起来的</button>
        <button>LangGraph 的节点怎么串</button>
        <button>快速排序为什么快</button>
        <button>爬虫怎么抓到数据</button>
        <button>批量改文件名靠什么</button>
        <button>单元测试在测什么</button>
        <button>Docker 到底做了什么</button>
      </div>

      <section class="recent">
        <div class="recent-head">
          <span>recent — 3</span>
          <button>clear</button>
        </div>
        <div class="line">
          <span class="ok">✓</span>
          <span class="t">登录注册是怎么回事</span>
          <span class="meta">12 步</span>
          <span class="acts"><button>open</button><button class="danger">del</button></span>
        </div>
        <div class="line">
          <span class="ok">✓</span>
          <span class="t">function call 怎么调起来的</span>
          <span class="meta">9 步</span>
          <span class="acts"><button>open</button><button class="danger">del</button></span>
        </div>
        <div class="line">
          <span class="ok wait">·</span>
          <span class="t">爬虫怎么抓到数据</span>
          <span class="meta">未完成</span>
          <span class="acts"><button>open</button><button class="danger">del</button></span>
        </div>
      </section>

      <footer>每一步都留在屏幕上</footer>
    </div>
  </body>
</html>
