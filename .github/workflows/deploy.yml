# push 到 main → 本机无关的自动部署：GitHub 构建前端 → rsync 全量同步 → 重启 systemd
# 用 rsync 而不是让服务器 git pull：这台服务器访问 github.com 超时（curl 000）
name: 自动部署

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'HANDOFF.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 构建前端
        run: cd web && pnpm install --frozen-lockfile && pnpm build

      - name: 准备 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: 测试 SSH 连接
        run: |
          ssh -v -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} \
            -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o BatchMode=yes \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'echo ssh-ok; hostname'

      - name: 同步到服务器
        run: |
          rsync -az --delete \
            --exclude '.venv' --exclude '.env' --exclude 'var' \
            --exclude '.git' --exclude 'node_modules' --exclude '__pycache__' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/step-coding/

      - name: 更新依赖并重启
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'cd /opt/step-coding && .venv/bin/pip install -q -r requirements.txt && systemctl restart step-coding && sleep 2 && curl -s localhost:8790/api/health'
