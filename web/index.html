<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-visual：键盘弹出只缩视觉视口，不重排布局，呼出输入框时页面不会跳 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual"
    />
    <title>Step Coding</title>
    <!-- 图标内联成 data URI：后端只暴露 / 和 /assets，放 public/ 的文件线上拿不到 -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171717'/%3E%3Crect x='7' y='19' width='5' height='6' rx='1.5' fill='white'/%3E%3Crect x='13.5' y='14' width='5' height='11' rx='1.5' fill='white'/%3E%3Crect x='20' y='9' width='5' height='16' rx='1.5' fill='white'/%3E%3C/svg%3E"
    />
    <script>
      // 先把主题写上，免得首帧亮一下再切到深色
      (function () {
        try {
          var saved = localStorage.getItem("step-theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
